<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
   <title>Atom Статистика</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            line-height: 1.4;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 32px;
            width: 100%;
            max-width: 560px;
            padding: 24px 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo {
            background: #ed5d19;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: #000;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .badge {
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #ed5d19;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .section-title {
            color: #666;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin: 20px 0 12px 0;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 14px 18px;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .field input:focus {
            border-color: #ed5d19;
        }

        .btn {
            background: #ed5d19;
            border: none;
            border-radius: 28px;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            color: #000;
            width: 100%;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }

        .btn:active {
            background: #ff6f2a;
        }

        .btn-secondary {
            background: #1a1a1a;
            color: #fff;
        }

        .profile {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: #ed5d19;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            color: #000;
        }

        .info h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info .handle {
            color: #ed5d19;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .stat-item {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .stat-value small {
            color: #ed5d19;
            font-size: 14px;
            margin-left: 4px;
        }

        .monthly-list {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .month-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .month-item:last-child {
            border-bottom: none;
        }

        .month-name {
            color: #fff;
            font-size: 15px;
        }

        .month-count {
            background: #ed5d19;
            color: #000;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 30px;
        }

        .error {
            background: #221212;
            border: 1px solid #5a2a2a;
            color: #ff9e9e;
            padding: 12px 16px;
            border-radius: 20px;
            margin: 16px 0;
            font-size: 14px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #1a1a1a;
            color: #666;
            font-size: 13px;
        }

        .footer a {
            color: #ed5d19;
            text-decoration: none;
            border-bottom: 1px dotted #ed5d19;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .income-highlight {
            background: #0f0f0f;
            border: 2px solid #ed5d19;
            border-radius: 20px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
        }

        .income-label {
            color: #ed5d19;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .income-amount {
            color: #fff;
            font-size: 36px;
            font-weight: 700;
        }

        .income-amount small {
            color: #ed5d19;
            font-size: 18px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">📊</div>
            <div class="title">Atom Статистика</div>
        </div>
        <div class="badge">доход ATM · посты</div>
        
        <div id="loginForm">
            <div class="section-title">вход</div>
            
            <div class="field">
                <label>никнейм</label>
                <input type="text" id="username" placeholder="@username">
            </div>

            <div class="field">
                <label>пароль</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn" id="loginBtn">войти</button>
        </div>

        <div id="statsSection" class="hidden">
            <div class="profile">
                <div class="profile-row">
                    <div class="avatar" id="avatar">⚛️</div>
                    <div class="info">
                        <h2 id="fullName"></h2>
                        <div class="handle" id="userHandle"></div>
                    </div>
                </div>
            </div>

            <div class="income-highlight">
                <div class="income-label">доход за текущий месяц</div>
                <div class="income-amount" id="monthlyIncome">0 <small>ATM</small></div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">всего постов</div>
                    <div class="stat-value" id="totalPosts">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">месяцев</div>
                    <div class="stat-value" id="totalMonths">0</div>
                </div>
            </div>

            <div class="section-title">посты по месяцам</div>
            <div id="monthlyList" class="monthly-list">
                <div class="loading">загрузка...</div>
            </div>

            <button class="btn btn-secondary" id="refreshBtn" style="margin-top: 16px;">🔄 обновить</button>
        </div>

        <div class="footer">
            <span>Atom API</span>
            <a id="logoutLink">выйти</a>
        </div>
    </div>

    <script>
        (function() {
            let currentToken = null;
            let userId = null;

            const loginForm = document.getElementById('loginForm');
            const statsSection = document.getElementById('statsSection');
            
            const usernameInp = document.getElementById('username');
            const passwordInp = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            
            const avatar = document.getElementById('avatar');
            const fullNameElement = document.getElementById('fullName');
            const userHandle = document.getElementById('userHandle');
            const totalPosts = document.getElementById('totalPosts');
            const totalMonths = document.getElementById('totalMonths');
            const monthlyIncome = document.getElementById('monthlyIncome');
            const monthlyList = document.getElementById('monthlyList');
            const refreshBtn = document.getElementById('refreshBtn');
            const logoutLink = document.getElementById('logoutLink');

            function parseJwt(token) {
                try {
                    const base64Url = token.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    return JSON.parse(atob(base64));
                } catch (e) {
                    return null;
                }
            }

            async function loadUserPosts() {
                if (!currentToken || !userId) return;

                try {
                    monthlyList.innerHTML = '<div class="loading">загрузка...</div>';

                    const response = await fetch(`https://atomglidedev.ru/posts/user/${userId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Accept': 'application/json'
                        }
                    });

                    if (!response.ok) throw new Error('Ошибка загрузки постов');
                    
                    const posts = await response.json();
                    
                    const postsByMonth = {};
                    
                    if (Array.isArray(posts)) {
                        posts.forEach(post => {
                            const date = new Date(post.createdAt || Date.now());
                            const month = date.toLocaleString('ru', { month: 'long', year: 'numeric' });
                            postsByMonth[month] = (postsByMonth[month] || 0) + 1;
                        });
                    }

                    const total = Object.values(postsByMonth).reduce((a, b) => a + b, 0);
                    totalPosts.textContent = total;
                    totalMonths.textContent = Object.keys(postsByMonth).length;

                    if (Object.keys(postsByMonth).length === 0) {
                        monthlyList.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">нет постов</div>';
                    } else {
                        let html = '';
                        const sortedMonths = Object.keys(postsByMonth).sort((a, b) => {
                            return new Date(b.split(' ').reverse().join('-')) - new Date(a.split(' ').reverse().join('-'));
                        });
                        
                        sortedMonths.forEach(month => {
                            html += `
                                <div class="month-item">
                                    <span class="month-name">${month}</span>
                                    <span class="month-count">${postsByMonth[month]}</span>
                                </div>
                            `;
                        });
                        monthlyList.innerHTML = html;
                    }

                } catch (err) {
                    monthlyList.innerHTML = `<div class="error">ошибка загрузки: ${err.message}</div>`;
                }
            }

            async function loadUserTransactions() {
                if (!currentToken || !userId) return;

                try {
                    const response = await fetch('https://atomglidedev.ru/auth/transactions', {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Accept': 'application/json'
                        }
                    });

                    if (!response.ok) throw new Error('Ошибка загрузки транзакций');
                    
                    const data = await response.json();
                    const transactions = Array.isArray(data) ? data : (data.transactions || []);
                    
                    const postPayments = transactions.filter(tx => 
                        tx.description === "Начисление за пост"
                    );

                    const now = new Date();
                    const currentMonth = now.getMonth();
                    const currentYear = now.getFullYear();
                    
                    let monthlyIncomeTotal = 0;
                    
                    postPayments.forEach(tx => {
                        const txDate = new Date(tx.createdAt || Date.now());
                        if (txDate.getMonth() === currentMonth && txDate.getFullYear() === currentYear) {
                            monthlyIncomeTotal += parseFloat(tx.amount) || 0;
                        }
                    });

                    monthlyIncome.textContent = monthlyIncomeTotal.toFixed(2);

                } catch (err) {
                    monthlyIncome.textContent = '0';
                }
            }

            async function loadUserInfo() {
                if (!currentToken || !userId) return;

                try {
                    const response = await fetch(`https://atomglidedev.ru/users/${userId}`, {
                        headers: { 'Authorization': `Bearer ${currentToken}` }
                    });

                    if (!response.ok) throw new Error();
                    
                    const data = await response.json();
                    
                    fullNameElement.textContent = data.fullName || '—';
                    userHandle.textContent = data.username || '—';
                    avatar.textContent = (data.fullName || 'A').charAt(0).toUpperCase();

                } catch (err) {}
            }

            async function handleLogin() {
                let username = usernameInp.value.trim();
                const password = passwordInp.value.trim();

                if (!username || !password) {
                    alert('заполни поля');
                    return;
                }

                if (!username.startsWith('@')) {
                    username = '@' + username;
                }

                try {
                    loginBtn.textContent = '⏳';
                    loginBtn.disabled = true;

                    const response = await fetch('https://atomglidedev.ru/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) throw new Error();
                    
                    const data = await response.json();
                    const token = data.token || data.access_token;
                    
                    if (!token) throw new Error();

                    currentToken = token;
                    const userData = parseJwt(token) || {};
                    userId = userData._id;

                    loginForm.classList.add('hidden');
                    statsSection.classList.remove('hidden');
                    
                    await Promise.all([
                        loadUserInfo(), 
                        loadUserPosts(),
                        loadUserTransactions()
                    ]);

                } catch (err) {
                    alert('ошибка входа');
                } finally {
                    loginBtn.textContent = 'войти';
                    loginBtn.disabled = false;
                }
            }

            function logout() {
                currentToken = null;
                userId = null;
                
                loginForm.classList.remove('hidden');
                statsSection.classList.add('hidden');
                
                usernameInp.value = '';
                passwordInp.value = '';
            }

            loginBtn.addEventListener('click', handleLogin);
            refreshBtn.addEventListener('click', () => {
                Promise.all([loadUserPosts(), loadUserTransactions()]);
            });
            logoutLink.addEventListener('click', (e) => {
                e.preventDefault();
                logout();
            });

            passwordInp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            usernameInp.addEventListener('input', (e) => {
                let val = e.target.value;
                if (val && !val.startsWith('@')) {
                    e.target.value = '@' + val.replace(/^@+/, '');
                }
            });
        })();
    </script>
</body>
</html>
